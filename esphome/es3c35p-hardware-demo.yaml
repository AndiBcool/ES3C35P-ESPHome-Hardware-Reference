# ES3C35P hardware reference / ESPHome 2026.9.0
# ESPHome hardware demo: Robby image, LVGL touch, 48-kHz WAV recording/playback.
# Requires includes/*.h, robby_display.png, Wi-Fi secrets and FAT32 microSD.
# Based on the tested 48-kHz hardware configuration; device name and labels are generic.
# ES8311 ADC gain control: 0 to +32 dB.
esphome:
  name: es3c35p-lab
  friendly_name: ES3C35P Hardware Lab
  includes:
    - includes/guinea_sd_test.h
    - includes/guinea_native_wav.h
    - includes/guinea_wav_web.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            guinea_buddy::sd_test_once();
    - priority: -110
      then:
        - lambda: |-
            guinea_native::init(id(guinea_mic), id(guinea_speaker));
    - priority: -200
      then:
        - lambda: |-
            guinea_web::start();
    # Gespeicherten ADC-Wert erst nach Codec-Initialisierung anwenden.
    - priority: -250
      then:
        - delay: 3s
        - number.set:
            id: guinea_adc_gain
            value: !lambda 'return id(guinea_adc_gain).state;'
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - fatfs
        - esp_http_server

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

spi:
  - id: lcd_bus
    type: quad
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

i2c:
  - id: bus_a
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz
    scan: true


# Nativer ES8311 Codec
audio_dac:
  - platform: es8311
    id: guinea_codec
    i2c_id: bus_a
    address: 0x18
    sample_rate: 48000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false
    mic_gain: 24DB

# Home Assistant Lautstaerkeregler, Wert bleibt nach Neustart erhalten.
number:
  - platform: template
    id: guinea_volume
    name: "ES3C35P Speaker Volume"
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 85
    restore_value: true
    optimistic: true
    mode: slider
    set_action:
      - audio_dac.set_volume:
          id: guinea_codec
          volume: !lambda 'return x / 100.0f;'

# ADC-Lautstaerke: Register 0x17, 0xBF=0 dB, jeder Schritt +0,5 dB.
# Gespeicherten Reglerwert nach dem Boot erneut ins Register schreiben.
  - platform: template
    id: guinea_adc_gain
    name: "ES3C35P Mic ADC Gain"
    icon: mdi:microphone
    unit_of_measurement: "dB"
    min_value: 0
    max_value: 32
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 28
    # Der Regler speichert den letzten Wert; beim Boot wird er erneut
    # ins Codec-Register geschrieben (siehe on_boot oben).
    set_action:
      - lambda: |-
          // Gain 0...32 dB -> Register 0xBF...0xFF, 0,5 dB je Schritt.
          float db = x;
          if (db < 0.0f) db = 0.0f;
          if (db > 32.0f) db = 32.0f;
          const uint8_t target = static_cast<uint8_t>(191 + static_cast<int>(db * 2.0f + 0.5f));
          uint8_t before = 0;
          if (!id(guinea_codec).read_byte(0x17, &before)) {
            ESP_LOGE("guinea_gain", "ADC 0x17 nicht lesbar, keine Aenderung");
            return;
          }
          if (!id(guinea_codec).write_byte(0x17, target)) {
            ESP_LOGE("guinea_gain", "ADC 0x17 Schreibfehler");
            return;
          }
          uint8_t after = 0;
          if (id(guinea_codec).read_byte(0x17, &after)) {
            ESP_LOGI("guinea_gain", "ADC 0x17: 0x%02X -> 0x%02X (Soll 0x%02X, %.1f dB)", before, after, target, db);
          }

# Nativer I2S-Bus
i2s_audio:
  - id: guinea_i2s
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO18
    i2s_mclk_pin: GPIO17

# Nativer Lautsprecher
speaker:
  - platform: i2s_audio
    id: guinea_speaker
    i2s_audio_id: guinea_i2s
    i2s_dout_pin: GPIO15
    dac_type: external
    audio_dac: guinea_codec
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono

# Natives ESPHome-I2S-Mikrofon, analoger Eingang des ES8311
microphone:
  - platform: i2s_audio
    id: guinea_mic
    i2s_audio_id: guinea_i2s
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left

# SC8002B Verstaerker: GPIO1 aktiv LOW
switch:
  - platform: gpio
    id: guinea_amp
    name: "ES3C35P Amplifier"
    pin:
      number: GPIO1
      inverted: true
    restore_mode: ALWAYS_OFF


output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO41
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Brightness"
    output: backlight_pwm
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: lcd
    spi_id: lcd_bus
    model: CUSTOM
    bus_mode: quad
    cs_pin: GPIO10
    data_rate: 40MHz

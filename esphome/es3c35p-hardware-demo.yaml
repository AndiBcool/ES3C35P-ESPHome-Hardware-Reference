touchscreen:
  - platform: st7123
    id: touch
    i2c_id: bus_a
    address: 0x55
    reset_pin: GPIO48
    display: lcd
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "TOUCH x=%d y=%d raw_x=%d raw_y=%d",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);

image:
  - platform: file
    file: robby_display.png
    id: robby_portrait
    type: RGB565
    resize: 320x480

font:
  - file: "gfonts://Roboto"
    id: font_lg
    size: 40
  - file: "gfonts://Roboto"
    id: font_md
    size: 24

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  rotation: 0
  buffer_size: 25%
  pages:
    - id: main_page
      widgets:
        - image:
            src: robby_portrait
            align: TOP_LEFT
            x: 0
            y: 0
        - label:
            id: readout
            align: TOP_MID
            y: 354
            text_font: font_md
            text_color: 0xFFFFFF
            bg_color: 0x202530
            text: "Bereit"
        - button:
            id: record_button
            align: TOP_LEFT
            x: 8
            y: 409
            width: 149
            height: 61
            bg_color: 0xB73540
            widgets:
              - label:
                  align: CENTER
                  text_font: font_md
                  text: "AUFNAHME"
            on_click:
              - if:
                  condition:
                    lambda: 'return guinea_native::recording.load();'
                  then:
                    - script.execute: stop_recording
                  else:
                    - script.execute: start_recording
        - button:
            id: play_button
            align: TOP_LEFT
            x: 163
            y: 409
            width: 149
            height: 61
            bg_color: 0x2372B8
            widgets:
              - label:
                  align: CENTER
                  text_font: font_md
                  text: "ABSPIELEN"
            on_click:
              - script.execute: play_recording

# Puffer von Audio-Callback zur microSD in kurzen Portionen leeren.
interval:
  - interval: 20ms
    then:
      - lambda: |- 
          guinea_native::pump();

script:
  - id: start_recording
    mode: single
    then:
      - if:
          condition:
            lambda: 'return guinea_native::begin_record();'
          then:
            - lvgl.label.update:
                id: readout
                text: "Aufnahme laeuft..."
            - microphone.capture: guinea_mic
  - id: stop_recording
    mode: single
    then:
      - microphone.stop_capture: guinea_mic
      - wait_until:
          condition:
            lambda: 'return id(guinea_mic)->is_stopped();'
          timeout: 3s
      - lambda: |-
          guinea_native::finish_record();
      - lvgl.label.update:
          id: readout
          text: "WAV gespeichert"
  - id: play_recording
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !guinea_native::recording.load() && !guinea_native::playing.load();'
          then:
            - switch.turn_on: guinea_amp
            - delay: 150ms
            - audio_dac.mute_off:
                id: guinea_codec
            - audio_dac.set_volume:
                id: guinea_codec
                volume: !lambda 'return id(guinea_volume).state / 100.0f;' 
            - if:
                condition:
                  lambda: 'return guinea_native::begin_play();'
                then:
                  - lvgl.label.update:
                      id: readout
                      text: "Wiedergabe..."
                  - wait_until:
                      condition:
                        lambda: 'return guinea_native::play_done.load();'
                      timeout: 60s
                  - delay: 1000ms
                  - lvgl.label.update:
                      id: readout
                      text: "Wiedergabe beendet"
            - switch.turn_off: guinea_amp


button:
  # Nur lesender Register-Dump: keine Aenderung an Codec oder Audio.
  - platform: template
    name: "ES8311 Mikrofonregister auslesen"
    on_press:
      - lambda: |-
          ESP_LOGI("guinea_es8311_diag", "ES8311 Registerdiagnose (nur lesen), I2C 0x18");
          const uint8_t regs[] = {0x0D, 0x0E, 0x14, 0x16, 0x17, 0x18, 0x1C};
          for (uint8_t reg : regs) {
            uint8_t value = 0;
            if (id(guinea_codec).read_byte(reg, &value)) {
              ESP_LOGI("guinea_es8311_diag", "Register 0x%02X = 0x%02X", reg, value);
              if (reg == 0x14) {
                ESP_LOGI("guinea_es8311_diag", "  Eingang: %s; PGA-Code=%u (~%u dB)",
                         (value & 0x40) ? "DIGITAL/DMIC" : "ANALOG",
                         (unsigned)(value & 0x0F), (unsigned)(3 * (value & 0x0F)));
              }
            } else {
              ESP_LOGE("guinea_es8311_diag", "Register 0x%02X konnte nicht gelesen werden", reg);
            }
          }
  - platform: template
    name: "microSD erneut testen"
    on_press:
      - lambda: |-
          guinea_buddy::sd_test_once();
